<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>온음아트</title>
  <meta name="description" content="음악과 함께하는 시간을 만듭니다. 악기 연습 자동 기록 앱 MU:note — 온음아트">
  <link rel="canonical" href="https://oneumart.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="온음아트">
  <meta property="og:description" content="음악과 함께하는 시간을 만듭니다 — MU:note">
  <meta property="og:url" content="https://oneumart.com/">
  <style>
    :root {
      --paper: #FAFAFA;
      --ink: #111111;
      --sub: #666666;
      --faint: #9A9A9A;
      --line: #ECECEC;
      --card: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      word-break: keep-all;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }
    header { padding: 120px 0 72px; }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: 0.16em; color: var(--faint); }
    h1 { margin-top: 20px; font-size: 44px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.25; }
    .lede { margin-top: 18px; font-size: 17px; color: var(--sub); }
    .rule { width: 64px; height: 3px; background: var(--ink); margin: 56px 0; }
    .section-label { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: var(--faint); margin-bottom: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 32px 28px; margin-bottom: 16px;
    }
    .card h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
    .card .desc { margin-top: 8px; font-size: 15px; color: var(--sub); }
    .card .links { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 10px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 600; text-decoration: none;
    }
    .btn-fill { background: var(--ink); color: #fff; }
    .btn-line { border: 1px solid var(--ink); color: var(--ink); }
    .tag { display: inline-block; margin-top: 14px; font-size: 13px; color: var(--faint); }
    footer { padding: 72px 0 64px; color: var(--faint); font-size: 13px; }
    @media (max-width: 480px) {
      header { padding: 88px 0 56px; }
      h1 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">ONEUM ART</div>
      <h1>온음아트</h1>
      <p class="lede">음악과 함께하는 시간을 만듭니다.</p>
    </header>

    <div class="rule"></div>

    <main>
      <div class="section-label">SERVICES</div>

      <div class="card">
        <h2>MU:note</h2>
        <p class="desc">내 악기 소리만 자동으로 세는 연습 기록.<br>연습을 시작하면 앱이 악기 소리를 알아듣고, 연주한 시간만 기록합니다.</p>
        <div class="links">
          <a class="btn btn-fill" href="https://apps.apple.com/kr/app/mu-note/id6800597794">App Store에서 받기</a>
          <a class="btn btn-line" href="/munote/">자세히 보기</a>
        </div>
      </div>

    </main>

    <footer>© 2026 온음아트 (ONEUM ART)</footer>
  </div>
</body>
</html>
